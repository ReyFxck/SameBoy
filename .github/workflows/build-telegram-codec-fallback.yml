name: Build Telegram Codec Fallback APK

on:
  push:
    branches:
      - telegram-codec-fallback-build
    paths:
      - 'tools/TelegramCodecFallback/**'
      - '.github/workflows/build-telegram-codec-fallback.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p tools/TelegramCodecFallback :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp tools/TelegramCodecFallback/app/build/outputs/apk/debug/app-debug.apk TelegramCodecFallback-v1.1-test2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCodecFallback-v1.1-test2
          path: TelegramCodecFallback-v1.1-test2.apk
