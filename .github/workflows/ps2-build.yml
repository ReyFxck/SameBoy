name: PS2 build

on:
  push:
    branches:
      - ps2-port
  pull_request:
    branches:
      - buildbot
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SameBoy + RetroArch PS2 frontend
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ghcr.io/ps2dev/ps2dev:latest \
            sh -c '
              set -eux
              apk add --no-cache make git util-linux python3 xorriso
              git config --global --add safe.directory /src

              # The libretro fork we started from is SameBoy 0.15.4. Build the
              # current 1.0.3 core instead, pinned for reproducibility, while
              # keeping all PS2 port glue in this fork.
              rm -rf SameBoyCurrent
              git clone https://github.com/LIJI32/SameBoy.git SameBoyCurrent
              cd SameBoyCurrent
              git checkout 213a12ce93d66b105a113debd9396306066a7cfc
              cp ../libretro/Makefile.ps2 libretro/Makefile.ps2
              python3 ../tools/ps2/patch_upstream_sameboy_ps2.py .
              make -C libretro -f Makefile.ps2 clean all
              cd ..

              # Pin the frontend so our PS2 CDFS/menu/audio patches are reproducible.
              rm -rf RetroArch
              git clone https://github.com/libretro/RetroArch.git RetroArch
              cd RetroArch
              git checkout 96bb0daa119b8a4c292f0ff9203f1bb771965e12
              cp ../SameBoyCurrent/libretro/sameboy_libretro_ps2.a ./libretro_ps2.a
              python3 ../tools/ps2/patch_retroarch_ps2.py .
              python3 ../tools/ps2/patch_retroarch_ps2_dirs.py .
              python3 ../tools/ps2/patch_retroarch_ps2_runtime.py .
              python3 ../tools/ps2/patch_retroarch_ps2_static_core.py .
              python3 ../tools/ps2/patch_retroarch_ps2_perf.py .
              python3 ../tools/ps2/patch_retroarch_ps2_audio.py .

              # Full RetroArch PS2 menu/frontend with SameBoy linked statically.
              make -f Makefile.ps2 clean
              make -f Makefile.ps2 -j2
              cd ..

              rm -rf dist
              mkdir -p dist/iso/ROMS
              cp RetroArch/retroarch_ps2.elf dist/SAMEBOY_UNPACKED.ELF
              if command -v ps2-packer >/dev/null 2>&1; then
                ps2-packer RetroArch/retroarch_ps2.elf dist/SAMEBOY.ELF
              else
                cp RetroArch/retroarch_ps2.elf dist/SAMEBOY.ELF
              fi
              cp dist/SAMEBOY.ELF dist/iso/SAMEBOY.ELF

              printf "BOOT2 = cdrom0:\\\\SAMEBOY.ELF;1\nVER = 1.00\nVMODE = NTSC\n" > dist/iso/SYSTEM.CNF

              # Copyrighted ROMs never enter Git. Reserve the fixed test extent.
              dd if=/dev/zero of=dist/iso/ROMS/MARIO.GB bs=65536 count=1

              xorriso -as mkisofs \
                -iso-level 1 -J -V SAMEBOY_PS2 \
                -o dist/sameboy_ps2_template.iso dist/iso

              xorriso -indev dist/sameboy_ps2_template.iso \
                -find /ROMS/MARIO.GB -exec report_lba -- \
                > dist/rom_lba.txt
            '

      - name: Inspect output
        run: |
          ls -lh SameBoyCurrent/libretro/sameboy_libretro_ps2.a \
                 dist/SAMEBOY.ELF \
                 dist/SAMEBOY_UNPACKED.ELF \
                 dist/sameboy_ps2_template.iso
          cat dist/rom_lba.txt
          sha256sum SameBoyCurrent/libretro/sameboy_libretro_ps2.a \
                    dist/SAMEBOY.ELF \
                    dist/SAMEBOY_UNPACKED.ELF \
                    dist/sameboy_ps2_template.iso

      - name: Upload PS2 build
        uses: actions/upload-artifact@v4
        with:
          name: sameboy-ps2-full
          path: |
            SameBoyCurrent/libretro/sameboy_libretro_ps2.a
            dist/SAMEBOY.ELF
            dist/SAMEBOY_UNPACKED.ELF
            dist/sameboy_ps2_template.iso
            dist/rom_lba.txt
