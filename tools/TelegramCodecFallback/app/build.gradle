plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.reyfxck.telegramcodecfallback'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.reyfxck.telegramcodecfallback'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-test1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
